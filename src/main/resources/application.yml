server:
  port: 8099

spring:
  application:
    name: manantial-ms-consumer
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
  data:
    mongodb:
      uri: ${DB_HOST:mongodb://localhost:27017/customer_db?authSource=admin}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
file_path:
  customer:
    information: ${PATH_CUSTOMERS:customers/pdf}
storage:
  type: ${STORAGE_TYPE:local} # Options: local, s3, blob
amazon:
  region: ${AWS_REGION:REGION}
  access_key: ${AWS_S3_ACCESS_KEY:ACCESS_KEY}
  secret_key: ${AWS_S3_SECRET_KEY:SECRET_KEY}
  s3:
    bucket: ${AWS_S3_BUCKET:BUCKET}
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
    endpoint:
      prometheus:
        enabled: true
    metrics:
      enable:
        jvm: true
        logback: true
      export:
        prometheus:
          enabled: true
