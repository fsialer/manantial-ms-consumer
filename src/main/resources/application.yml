server:
  port: 8099

spring:
  application:
    name: manantial-ms-consumer
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:password}
storage:
  type: ${STORAGE_TYPE:local} # Options: local, s3, blob
  path: ${STORAGE_PATH:/pdfs}
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
    endpoint:
      prometheus:
        enabled: true
    metrics:
      enable:
        jvm: true
        logback: true
      export:
        prometheus:
          enabled: true
logging:
  file:
    name: ./logs/app.log
